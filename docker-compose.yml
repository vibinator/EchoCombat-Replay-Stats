# Echo Combat Stats on a QNAP NAS: Container Station > Applications > Create, paste this file, Create.
# The app image is built by GitHub on every upload (ghcr.io); the NAS only downloads it. Container Station needs a
# login for ghcr.io first (Setup.MD, QNAP NAS). Public at https://echocombat.com through a Cloudflare Tunnel.
# Before deploying replace YOUR_CLOUDFLARE_TUNNEL_TOKEN and check the NAS folders under "volumes".
# Never upload this file to GitHub with a real token in it (upload_to_github.bat refuses).
services:
  echovr-replay-stats:
    image: ghcr.io/vibinator/echocombat-replay-stats:latest
    pull_policy: always   # recreating the application picks up the newest upload
    container_name: echovr-replay-stats
    restart: unless-stopped
    ports:
      - "8000:8000"   # home network only: http://<nas address>:8000. Do NOT forward this port on the router.
    environment:
      ECHOVR_DATA_DIR: /data
      ECHOVR_REPLAY_SOURCE: /replays
      ECHOVR_WORKERS: "2"            # parallel import processes: 2 keeps pages quick while a big re-read runs (about half the NAS's cores); 4 = all of them, faster but "Server busy"
      ECHOVR_SCAN_INTERVAL_S: "300"  # seconds between full scans of the replay folder
      ECHOVR_QUICK_CHECK_S: "15"     # seconds between checks of the folders for new files (full scan when changed)
      ECHOVR_RATE_LIMIT_PER_MIN: "60"  # scraper protection: data requests per visitor per minute (0 = no limit)
      ECHOVR_RATE_LIMIT_PER_HOUR: "1500"  # ... and per hour (0 = no hourly limit)
      ECHOVR_DB_CACHE_MB: "2048"     # RAM for the database (faster pages); shared file cache, given back when needed. 0 = off
      ECHOVR_TRACK_CACHE_MB: "3072"  # RAM for heatmap / playback position data (~70 KB a match: 3 GB holds every match); 0 = off
      ECHOVR_CACHE_REFRESH_S: "300"  # pages answer at once and are recalculated in the background at most this often (s)
      ECHOVR_EDGE_CACHE_S: "60"      # Cloudflare may keep public data answers this long (s); 0 = never (Setup.MD, Cloudflare cache)
      # Discord login: people with the preview role see achievements before their launch (Setup.MD, Discord login).
      # Leave the YOUR_... placeholders and the login stays off. Never upload real values to GitHub.
      ECHOVR_PUBLIC_URL: https://echocombat.com
      ECHOVR_DISCORD_CLIENT_SECRET: YOUR_DISCORD_CLIENT_SECRET
      ECHOVR_DISCORD_BOT_TOKEN: YOUR_DISCORD_BOT_TOKEN
      # Shared secret your Discord bot sends to link Discord accounts to players (D54); placeholder = off
      ECHOVR_BOT_LINK_SECRET: YOUR_BOT_LINK_SECRET
      # "Process replays on another PC" (Setup.MD, Remote processing): the PC's remote_worker.bat sends this; placeholder = off
      ECHOVR_REMOTE_WORKER_SECRET: YOUR_REMOTE_WORKER_SECRET
      # Combat stats (combat.py): the recorder's matches/ folder is inside the same share as the replays
      # (/share/ECRanked/ECRanked on the NAS), so the /replays mount below already holds it
      ECHOVR_COMBAT_SOURCE: /replays
      ECHOVR_CLOUD_QUOTA_GB: "250"   # Open Cloud page (Setup.MD, Open Cloud): at most this much in data/cloud; 0 = no limit (5 GB stay free)
      # Virus scanning of cloud uploads (Setup.MD, Open Cloud): the clamav service below; files are held until scanned
      ECHOVR_CLAMAV: clamav:3310
      ECHOVR_CLAMAV_MAX_MB: "1024"  # files up to this are virus-scanned before download; bigger: "Not scanned". Must match MaxFileSize below
      # VirusTotal fingerprint check (only the file's SHA-256 is sent, never the file); placeholder = off. Never upload a real key
      ECHOVR_VIRUSTOTAL_KEY: YOUR_VIRUSTOTAL_KEY
      ECHOVR_DISCORD_PREVIEW_ROLES: YOUR_PREVIEW_ROLE_ID   # role and / or user id(s), comma-separated: preview + Console page (admin.bat on the website)
    volumes:
      # Replay folder on the NAS (File Station: ECRanked > ECRanked), read-only; subfolders are scanned too
      - /share/ECRanked/ECRanked:/replays:ro
      # Database and processed files: kept when the app is updated (created automatically if missing)
      - /share/Container/echovr-replay-stats/data:/data

  # Virus scanner for the cloud uploads (antivirus.py). Updates its virus list by itself several times a day; the first start
  # downloads it (about 200 MB, a few minutes; uploads wait meanwhile). Uses about 1.2-1.6 GB of RAM.
  clamav:
    image: clamav/clamav:1.4   # official image; 1.4 = this release line with its security fixes
    container_name: echovr-clamav
    restart: unless-stopped
    # Scan files up to 1 GB (ClamAV's defaults: 100 MB per file, 400 MB unpacked; it cannot scan over 2 GB at all). The two
    # lines are added once to the image's own /etc/clamav/clamd.conf at start, everything else stays as the image ships it.
    # MaxFileSize must equal ECHOVR_CLAMAV_MAX_MB above; MaxScanSize = what an archive may unpack to and still be checked.
    entrypoint:
      - /bin/sh
      - -c
      - |
        grep -q '^MaxFileSize' /etc/clamav/clamd.conf || printf 'MaxFileSize 1024M\nMaxScanSize 2048M\n' >> /etc/clamav/clamd.conf
        exec /init
    volumes:
      - /share/Container/echovr-replay-stats/clamav:/var/lib/clamav   # the virus list, kept across restarts
      # the app's data folder at the same path as in the app, read-only: ClamAV reads the waiting files where they are
      - /share/Container/echovr-replay-stats/data:/data:ro

  # Connects echocombat.com to the app above (outgoing connection only). In Cloudflare, point the tunnel's public
  # hostnames echocombat.com and www.echocombat.com at http://echovr-replay-stats:8000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7   # pinned; to upgrade, change the tag (hub.docker.com/r/cloudflare/cloudflared/tags)
    container_name: echovr-cloudflared
    restart: unless-stopped
    # http2 (TCP) instead of the default QUIC (UDP): home routers forget an idle UDP connection after ~30 s, so the first
    # request after a quiet spell waited ~4 s while the tunnel reconnected (measured 2026-11-10: 20 s idle 0.1 s, 45 s idle
    # 4.3 s). Routers keep TCP connections far longer
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: YOUR_CLOUDFLARE_TUNNEL_TOKEN   # Cloudflare Zero Trust > Networks > Tunnels (the long "eyJ..." value)
    depends_on:
      - echovr-replay-stats
