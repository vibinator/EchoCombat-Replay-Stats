# EchoVR Replay Stats on a QNAP NAS: Container Station > Applications > Create, paste this file, Create.
# The app image is built by GitHub on every upload (ghcr.io); the NAS only downloads it. Container Station needs a
# login for ghcr.io first (Setup.MD, QNAP NAS). Public at https://echocombat.com through a Cloudflare Tunnel.
# Before deploying replace YOUR_CLOUDFLARE_TUNNEL_TOKEN and check the NAS folders under "volumes".
# Never upload this file to GitHub with a real token in it (upload_to_github.bat refuses).
services:
  echovr-replay-stats:
    image: ghcr.io/vibinator/echocombat-replay-stats:latest
    pull_policy: always   # recreating the application picks up the newest upload
    container_name: echovr-replay-stats
    restart: unless-stopped
    ports:
      - "8000:8000"   # home network only: http://<nas address>:8000. Do NOT forward this port on the router.
    environment:
      ECHOVR_DATA_DIR: /data
      ECHOVR_REPLAY_SOURCE: /replays
      ECHOVR_WORKERS: "4"            # parallel import processes: about the NAS's CPU core count
      ECHOVR_SCAN_INTERVAL_S: "300"  # seconds between full scans of the replay folder
      ECHOVR_QUICK_CHECK_S: "15"     # seconds between checks of the folders for new files (full scan when changed)
      ECHOVR_RATE_LIMIT_PER_MIN: "60"  # scraper protection: data requests per visitor per minute (0 = no limit)
      ECHOVR_RATE_LIMIT_PER_HOUR: "1500"  # ... and per hour (0 = no hourly limit)
      ECHOVR_DB_CACHE_MB: "1024"     # RAM for the database (faster pages); lower on a NAS with little RAM, 0 = off
      ECHOVR_TRACK_CACHE_MB: "512"   # RAM for heatmap / playback position data; 0 = off
      # Discord login: people with the preview role see achievements before their launch (Setup.MD, Discord login).
      # Leave the YOUR_... placeholders and the login stays off. Never upload real values to GitHub.
      ECHOVR_PUBLIC_URL: https://echocombat.com
      ECHOVR_DISCORD_CLIENT_SECRET: YOUR_DISCORD_CLIENT_SECRET
      ECHOVR_DISCORD_BOT_TOKEN: YOUR_DISCORD_BOT_TOKEN
      ECHOVR_DISCORD_PREVIEW_ROLES: YOUR_PREVIEW_ROLE_ID   # role and / or user id(s), comma-separated: preview + Console page (admin.bat on the website)
    volumes:
      # Replay folder on the NAS (File Station: ECRanked > ECRanked), read-only; subfolders are scanned too
      - /share/ECRanked/ECRanked:/replays:ro
      # Database and processed files: kept when the app is updated (created automatically if missing)
      - /share/Container/echovr-replay-stats/data:/data

  # Connects echocombat.com to the app above (outgoing connection only). In Cloudflare, point the tunnel's public
  # hostnames echocombat.com and www.echocombat.com at http://echovr-replay-stats:8000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: echovr-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: YOUR_CLOUDFLARE_TUNNEL_TOKEN   # Cloudflare Zero Trust > Networks > Tunnels (the long "eyJ..." value)
    depends_on:
      - echovr-replay-stats
