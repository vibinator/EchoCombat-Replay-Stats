# Builds the app image on every upload to main and publishes it to GitHub's registry (ghcr.io), where the QNAP NAS
# downloads it from (docker-compose.yml). The NAS has no git, so it cannot build from the repository itself.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 as well, in case the NAS has an ARM processor
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Known advisories in the pinned packages (Review SEC-7). Reported, not blocking: the build still runs; fix by
      # bumping the pin in requirements.txt / package.json
      - name: Audit Python packages (advisory)
        continue-on-error: true
        run: pip install --quiet pip-audit && pip-audit -r app/backend/requirements.txt --progress-spinner off
      - name: Audit npm packages (advisory)
        continue-on-error: true
        run: cd app/frontend && npm audit --omit=dev --audit-level=high
      - name: Read app version
        id: version
        run: echo "version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app/backend/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vibinator/echocombat-replay-stats:latest
            ghcr.io/vibinator/echocombat-replay-stats:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
