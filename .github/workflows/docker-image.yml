# Builds the app image on every upload to main and publishes it to GitHub's registry (ghcr.io), where the QNAP NAS
# downloads it from (docker-compose.yml). The NAS has no git, so it cannot build from the repository itself.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 as well, in case the NAS has an ARM processor
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read beta version
        id: version
        run: echo "beta=$(sed -n 's/^BETA = //p' app/backend/version.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vibinator/echocombat-replay-stats:latest
            ghcr.io/vibinator/echocombat-replay-stats:beta-${{ steps.version.outputs.beta }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
